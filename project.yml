name: Kontak
options:
  bundleIdPrefix: com.mbgunay32
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Kontak:
    type: application
    platform: iOS
    sources: [Kontak]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mbgunay32.kontak
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Kontak
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    info:
      path: Kontak/Info.plist
      properties:
        UIBackgroundModes: [location]
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Kontak sürüşlerini kaydetmek için konumunu kullanır.
        NSLocationAlwaysAndWhenInUseUsageDescription: Otomatik kayıt için Kontak, uygulama kapalıyken de hareket etmeye başladığını algılamak ister. Konumun telefondan dışarı gönderilmez.
        NSPhotoLibraryAddUsageDescription: Paylaşım kartını Fotoğraflar'a kaydetmek için.
